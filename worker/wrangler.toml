name = "patient-heart-c10a"
main = "src/index.js"
compatibility_date = "2026-11-01"

[ai]
binding = "AI"

# Comma-separated list of exact browser origins allowed to call the API.
[vars]
ALLOWED_ORIGINS = "https://pokecanvas-ashy.vercel.app"

# API_KEY (the private studio passphrase) is a Worker secret, set with
# `wrangler secret put API_KEY`. It is never stored in this file or in Git.
# For local development put a TEST value in worker/.dev.vars (git-ignored):
#   API_KEY=some-local-test-value
#   ALLOW_LOCAL_DEV=true
